server:
  port: 8081

spring:
  application:
    name: ordermgt
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:not-set}
      chat:
        options:
          model: qwen-max
          temperature: 0.2

# Assistant behaviour. memory.window = how many recent turns of a conversation are
# replayed to the model; memory never crosses conversations. action.ttl-minutes = how long
# a confirmation card stays valid before it is expired.
assistant:
  memory:
    window: 20
  action:
    ttl-minutes: 15
    sweep-interval-ms: 60000

# Retries carrying the same Idempotency-Key replay the stored response for this long.
idempotency:
  retention-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.ordermgt: DEBUG

---
# Local profile: embedded H2 in MySQL compatibility mode.
# No infrastructure required -- the demo runs with a bare `mvn spring-boot:run`.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./.data/ordermgt;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

---
# MySQL profile: the target database. Used by docker compose and by any real deployment.
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ordermgt}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:ordermgt}
    password: ${MYSQL_PASSWORD:ordermgt}
    driver-class-name: com.mysql.cj.jdbc.Driver
