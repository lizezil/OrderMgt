server:
  port: 8081
  # SIGTERM starts a drain instead of beheading the process: a stream whose tokens are already
  # being paid for gets up to the shutdown-phase window below to finish and persist its reply
  # (otherwise the question lands but the answer never does).
  shutdown: graceful

spring:
  application:
    name: ordermgt
  lifecycle:
    # Long enough for a near-complete stream to close, short enough that a redeploy is not held
    # hostage by the 120s worst-case stream budget.
    timeout-per-shutdown-phase: 30s
  # Single source of environment variables: the git-ignored .env at the repo root. The
  # `[.properties]` suffix is Spring Boot's extension hint -- without it a file named `.env`
  # has no extension any PropertySourceLoader recognises and the import is rejected. Both the
  # repo root (jar run from there, `make dev` after cd) and the backend module dir
  # (spring-boot:run forks the JVM with ${project.basedir} as cwd) are covered; `optional`
  # means the container, which gets its variables from docker-compose, is unaffected.
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  profiles:
    active: mysql
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:not-set}
      chat:
        options:
          # A pinned snapshot, not the rolling `qwen-max` alias: the alias is silently upgraded
          # by the provider (behaviour and pricing can shift under us), and the prompt budget
          # below is sized against this version's 30,720-token input window.
          model: qwen-max-2025-01-25
          temperature: 0.2
          # Output ceiling: qwen-max allows 8,192; half of that is more reply than any answer
          # here needs, and the cap is what stops one runaway generation from billing the rest.
          max-tokens: 4096
    # Spring AI retries blocking model calls by default -- but with 10 attempts and an exponential
    # backoff of 2s x5 capped at 3 minutes, i.e. a worst case of roughly 19 minutes for one call.
    # These are the only knobs it exposes (no jitter; see AiHttpClientConfig for the timeouts).
    # Streaming is not retried by the framework at all.
    # R1: an upstream 429 is never replayed -- its response-error handler classifies it as 4xx =>
    # NonTransientAiException, which this template does not retry, and the streaming replay gate
    # (SpringAiAdapter.retryBeforeFirstToken) checks the same 429 shape before replaying.
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 8s

# Assistant behaviour. memory.window = how many recent turns of a conversation are
# replayed to the model; memory never crosses conversations. action.ttl-minutes = how long
# a confirmation card stays valid before it is expired.
assistant:
  # Demo-grade identity: customerId:PIN pairs. There is deliberately no user table -- the customer
  # is a business key, and rotating a PIN means redeploying with a new value. Unknown customer and
  # wrong PIN share one failure message, so the login endpoint cannot enumerate customer ids.
  auth:
    pins: ${ASSISTANT_AUTH_PINS:1001:1111,2002:2222}
  memory:
    window: 20
  # Prompt budget, in characters (chars/2 ≈ tokens for mostly-Chinese prose). The system prompt,
  # the grounding facts and the replayed history must together fit max-prompt-chars; history is
  # trimmed oldest-first (last 2 turns always kept), grounding is capped by its own two knobs,
  # and a provider context-overflow retries once at half this budget before telling the customer
  # to start a new conversation. Sized against qwen-max's 30,720-token input window.
  ai:
    max-prompt-chars: 40000
    # Admissions per customer per minute, counted across both chat transports (sliding window,
    # see CustomerRateLimiter). Past it the entry point answers 429 RATE_LIMITED with a
    # Retry-After that counts down to when the oldest request slides out of the window.
    rate-limit: 6
    # Global cap on model calls in flight (see AiConcurrencyGuard). Past it an admission is
    # refused with 429 rather than queued, so a burst cannot hold every worker hostage.
    max-concurrent: 8
    grounding:
      max-rows: 200
      max-chars: 12000
  # How many streaming turns may wait in line behind the one in flight, per conversation
  # (ADR-0012). Past this the send is refused with 429 QUEUE_FULL: a full line is a capacity
  # fact, not a state conflict. The line lives in memory only, so a restart empties it.
  run:
    queue-depth: 5
  # The per-customer status stream (ADR-0014): GET /api/assistant/events. heartbeat-ms keeps the
  # long-lived connection (and any proxy in front of it) alive; max-connections-per-customer caps
  # how many tabs one customer may hold open, past which a new one is refused. This stream does NOT
  # run on the turn pool -- see ConversationEventBus.
  events:
    heartbeat-ms: 15000
    max-connections-per-customer: 4
  # The dedicated streaming pool (see AsyncConfig). max-concurrent = worker threads, i.e. how
  # many model streams can run at once; queue-capacity = how many more may wait for a thread.
  # Past max-concurrent + queue-capacity in-flight streams, /stream answers 503 instead of
  # queueing without bound. Kept as a property so load can be tuned without a recompile.
  stream:
    max-concurrent: 20
    queue-capacity: 100
  action:
    ttl-minutes: 15
    sweep-interval-ms: 60000

# Retries carrying the same Idempotency-Key replay the stored response for this long. After it,
# the key is deleted: replay stops, the key becomes claimable again, the table stays bounded.
idempotency:
  retention-hours: 24
  # How often expired keys are deleted (see IdempotencySweeper).
  sweep-interval-ms: 60000

# CSRF stays on in the running app: the single-page frontend reads the XSRF cookie (which is
# httpOnly=false for exactly this reason) and echoes it back as the X-XSRF-TOKEN header. Tests
# turn it off and cover the on-case explicitly in SecurityContractTest.
security:
  csrf:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.ordermgt: DEBUG

---
# MySQL profile: the target database, and now the only one. Local dev, the test suite and the
# Docker image all run against a real MySQL 8 -- by default the resident container from
# docker-compose.yml. There is no compatibility mode between the migration and the target DB.
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ordermgt}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:ordermgt}
    password: ${MYSQL_PASSWORD:ordermgt}
    driver-class-name: com.mysql.cj.jdbc.Driver
