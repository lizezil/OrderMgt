server:
  port: 8081

spring:
  application:
    name: ordermgt
  profiles:
    active: mysql
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:not-set}
      chat:
        options:
          model: qwen-max
          temperature: 0.2
    # Spring AI retries blocking model calls by default -- but with 10 attempts and an exponential
    # backoff of 2s x5 capped at 3 minutes, i.e. a worst case of roughly 19 minutes for one call.
    # These are the only knobs it exposes (no jitter; see AiHttpClientConfig for the timeouts).
    # Streaming is not retried by the framework at all.
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 8s

# Assistant behaviour. memory.window = how many recent turns of a conversation are
# replayed to the model; memory never crosses conversations. action.ttl-minutes = how long
# a confirmation card stays valid before it is expired.
assistant:
  memory:
    window: 20
  action:
    ttl-minutes: 15
    sweep-interval-ms: 60000

# Retries carrying the same Idempotency-Key replay the stored response for this long.
idempotency:
  retention-hours: 24
  # How often a key left IN_PROGRESS past its expiry is failed so it can be retried (see
  # IdempotencySweeper).
  sweep-interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.ordermgt: DEBUG

---
# MySQL profile: the target database, and now the only one. Local dev, the test suite and the
# Docker image all run against a real MySQL 8 -- by default the resident container from
# docker-compose.yml. There is no compatibility mode between the migration and the target DB.
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ordermgt}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:ordermgt}
    password: ${MYSQL_PASSWORD:ordermgt}
    driver-class-name: com.mysql.cj.jdbc.Driver
