# Test profile: the suite runs against a real MySQL 8 -- the resident container from
# docker-compose.yml (localhost:3306 by default). A dedicated schema, `ordermgt_test`, keeps
# test data away from the dev/demo database in `ordermgt`; createDatabaseIfNotExist lets the
# root user create it on first run. No H2: the point is to exercise the real target dialect.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/ordermgt_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_ROOT_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:root}
  flyway:
    # The suite counts exact rows and reuses fixed idempotency keys, so it needs a pristine
    # schema each run: the FlywayMigrationStrategy in AssistantFlowTest does clean + migrate.
    # Spring Boot disables `clean` by default; re-enable it for this profile only.
    clean-disabled: false
  ai:
    openai:
      # The real adapter is a bean the tests replace. The key only has to exist so the
      # OpenAI auto-configuration can construct its client; no request is ever made.
      api-key: test-key-never-used

assistant:
  action:
    # Keep the expiry sweeper out of the way: tests drive expiry explicitly.
    sweep-interval-ms: 3600000

logging:
  level:
    com.example.ordermgt: INFO
